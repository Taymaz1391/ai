name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt httpx
      - name: Gradient & KV checks
        run: python tests/gradcheck.py
      - name: Unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p "test_*.py" -v > tests.log 2>&1
          status=$?
          tail -n 60 tests.log
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E "^(FAIL|ERROR):" tests.log | head -n 12 | tr '\n' '|')
            [ -z "$summary" ] && summary=$(tail -n 6 tests.log | tr '\n' '|')
            echo "::error title=unit-tests-failed::$summary"
            exit "$status"
          fi
