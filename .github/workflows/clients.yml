name: clients

# ساخت APK اندروید و EXE ویندوز به‌عنوان کلاینت‌های نازکِ همان سرور.
# خروجی‌ها به انتشار «clients» در همین مخزن پیوست می‌شوند تا از سایت
# با نشانی ثابت .../releases/latest/download/rayan-android.apk قابل دریافت باشند.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "نشانی سرور که داخل کلاینت‌ها ساخته می‌شود"
        required: false
        default: ""
  push:
    paths:
      - "clients/**"
      - ".github/workflows/clients.yml"

permissions:
  contents: write

env:
  SERVER_URL: ${{ github.event.inputs.server_url || vars.RAYAN_SERVER_URL || 'https://rayan.example' }}

jobs:
  android:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        working-directory: clients/android
        run: gradle --no-daemon :app:assembleRelease -PserverUrl="$SERVER_URL"
      - name: Rename artifact
        run: |
          mkdir -p out
          cp clients/android/app/build/outputs/apk/release/app-release.apk out/rayan-android.apk
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: rayan-android
          path: out/rayan-android.apk

  windows:
    name: EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Bake server address
        shell: pwsh
        run: |
          @"
          namespace Rayan;

          internal static class BuildInfo
          {
              internal const string ServerUrl = "$env:SERVER_URL";
          }
          "@ | Set-Content -Encoding UTF8 clients/windows/BuildInfo.cs
      - name: Publish single-file EXE
        working-directory: clients/windows
        run: dotnet publish Rayan.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item clients/windows/publish/Rayan.exe out/rayan-windows.exe
          Get-Item out/rayan-windows.exe | Format-List Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: rayan-windows
          path: out/rayan-windows.exe

  release:
    name: Publish downloads
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create or update the «clients» release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if ! gh release view clients --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create clients \
              --repo "$GITHUB_REPOSITORY" \
              --title "رایان — نسخه‌های نصب (APK و EXE)" \
              --notes "کلاینت‌های نازک رایان. هر دو به همان سرور وصل می‌شوند؛ ورود، نقش مدیر و سهمیه فقط سمت سرور تعیین می‌شود."
          fi
          gh release upload clients dist/rayan-android/rayan-android.apk dist/rayan-windows/rayan-windows.exe \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view clients --repo "$GITHUB_REPOSITORY" --json assets,url
