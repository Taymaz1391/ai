name: انتشار سایت

# سایتِ رایان را از همین مخزن می‌سازد و روی GitHub Pages منتشر می‌کند.
on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ساخت نسخهٔ استاتیک
        run: python scripts/export_site.py --out _site
      - name: نشانه‌گذاری برای Pages
        run: |
          touch _site/.nojekyll
          printf '%s\n' "taymaz1391.github.io" > _site/CNAME.tmp && rm -f _site/CNAME.tmp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
