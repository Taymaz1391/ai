name: انتشار سایت

# سایتِ رایان را از همین مخزن می‌سازد و روی GitHub Pages منتشر می‌کند.
on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ساخت نسخهٔ استاتیک
        run: python scripts/export_site.py --out _site
      - name: نشانه‌گذاری برای Pages
        run: |
          touch _site/.nojekyll
          printf '%s\n' "taymaz1391.github.io" > _site/CNAME.tmp && rm -f _site/CNAME.tmp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # اگر Pages در تنظیمات مخزن روشن نشده باشد، انتشار شکست نمی‌خورد؛
      # فقط با یک پیامِ روشن رد می‌شود. روشن‌کردنش فقط دستِ مالکِ مخزن است:
      # Settings → Pages → Source = GitHub Actions
      - name: بررسیِ روشن‌بودنِ Pages
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if curl -sf -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "${{ github.api_url }}/repos/${{ github.repository }}/pages" > /dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages خاموش است::برای انتشار، Settings → Pages → Source را روی «GitHub Actions» بگذار و این کار را دوباره اجرا کن."
          fi
      - id: deployment
        if: steps.probe.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
