name: pages

# انتشار نسخهٔ استاتیک سایت روی GitHub Pages.
# پیش‌نیاز یک‌باره: Settings → Pages → Source: «GitHub Actions».
# (ساخت خودکار فقط با فعال‌کردن Pages توسط مالک مخزن ممکن است.)

on:
  workflow_dispatch:
  push:
    branches: ["main", "arena/ddad3f43-ai"]
    paths:
      - "web/static/**"
      - "scripts/export_site.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Export static site
        run: python scripts/export_site.py --out _site
      - name: Static sanity check
        run: python scripts/check_static.py _site
      - name: Is Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=pages-disabled::Pages روشن نیست؛ Settings → Pages → Source: GitHub Actions"
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
