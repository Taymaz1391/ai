services:
  - type: web
    name: rayan
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web/server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # در تولید، گذرواژهٔ مالک باید صریح باشد؛ Render هنگام ساخت از تو می‌پرسد
      - key: RAYAN_ENV
        value: production
      - key: RAYAN_OWNER_PASSWORD
        sync: false
      - key: RAYAN_PUBLIC_URL
        sync: false
