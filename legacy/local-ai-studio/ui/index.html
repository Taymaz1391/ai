<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local AI Studio</title><style>:root{--bg:#080d1b;--panel:#111a30;--border:#263655;--accent:#687cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#1c2851 0,transparent 36%),var(--bg);color:#eff3ff;font:15px Tahoma,Arial,sans-serif}main{max-width:1080px;min-height:100vh;margin:auto;padding:24px;display:flex;flex-direction:column}.bar{display:flex;align-items:center;justify-content:space-between;background:rgba(17,26,48,.9);border:1px solid var(--border);border-radius:22px;padding:16px 20px;box-shadow:0 15px 50px #0003}.brand{font-size:21px;font-weight:700}.sub{font-size:11px;color:#8f9abb;margin-top:5px}.status{color:#68e4a5;font-size:12px}.chat{flex:1;display:flex;flex-direction:column;gap:14px;padding:22px 4px;overflow:auto}.welcome{text-align:center;margin:auto;color:#8795b8;line-height:2}.bubble{max-width:min(78%,720px);padding:13px 17px;border-radius:18px;white-space:pre-wrap;line-height:1.9;animation:in .2s ease}.user{align-self:flex-start;background:linear-gradient(135deg,#4964e9,#647bff);border-bottom-left-radius:5px}.bot{align-self:flex-end;background:var(--panel);border:1px solid var(--border);border-bottom-right-radius:5px}@keyframes in{from{opacity:0;transform:translateY(5px)}}.composer{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:10px;display:flex;gap:10px}.composer textarea{flex:1;background:transparent;color:#fff;border:0;outline:0;resize:none;font:inherit;padding:12px;height:56px}.send,.new{border:0;border-radius:14px;color:#fff;cursor:pointer;font:inherit}.send{background:var(--accent);padding:0 24px;font-weight:bold}.new{background:transparent;color:#aeb9d8;padding:8px 12px}.send:disabled{opacity:.5}.hint{text-align:center;color:#7180a4;font-size:11px;padding-top:10px}@media(max-width:600px){main{padding:12px}.bubble{max-width:90%}.brand{font-size:17px}.send{padding:0 15px}}</style></head><body><main><header class="bar"><div><div class="brand">✦ Local AI Studio</div><div class="sub">مدل زبانی محلی · بدون API خارجی</div></div><div><button class="new" id="new">گفتگوی جدید</button><span class="status" id="status">● محلی</span></div></header><section class="chat" id="chat"><div class="welcome">سلام!<br>مدل محلی خودت را آموزش بده و گفتگو را شروع کن.</div></section><form class="composer" id="form"><textarea id="input" placeholder="پیامت را بنویس..." autofocus></textarea><button class="send" id="send">ارسال</button></form><div class="hint">Enter برای ارسال · Shift+Enter برای خط جدید</div></main><script>const chat=document.querySelector('#chat'),input=document.querySelector('#input'),send=document.querySelector('#send'),status=document.querySelector('#status');let sid=crypto.randomUUID();function add(t,c){document.querySelector('.welcome')?.remove();let x=document.createElement('div');x.className='bubble '+c;x.textContent=t;chat.append(x);chat.scrollTop=chat.scrollHeight}document.querySelector('#new').onclick=()=>{sid=crypto.randomUUID();chat.innerHTML='<div class="welcome">گفتگوی جدید آماده است.</div>';input.focus()};fetch('/health').then(r=>r.json()).then(x=>status.textContent=x.ok?'● مدل آماده':'● مدل بارگذاری نشده').catch(()=>status.textContent='● سرور قطع است');document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let t=input.value.trim();if(!t)return;add(t,'user');input.value='';send.disabled=true;try{let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,session_id:sid})});let d=await r.json();add(d.answer||d.detail||'خطا','bot')}catch(_){add('اتصال به سرور محلی برقرار نشد.','bot')}send.disabled=false;input.focus()};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('#form').requestSubmit()}}</script></body></html>
