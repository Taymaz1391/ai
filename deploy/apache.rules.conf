# ─────────────────────────────────────────────────────────────
# رایان — قواعد آپاچی برای هاست اشتراکی
# این فایل عمداً هیچ دستورِ Passenger ندارد؛ cPanel/Plesk خودش آن بلوک را
# می‌نویسد. محتوای زیر را به .htaccess پوشهٔ برنامه اضافه کن (یا اگر .htaccess
# نداری، همین فایل را با نام .htaccess کپی کن).
# ─────────────────────────────────────────────────────────────
Options -Indexes

# ۱) فایل‌های خصوصی
<FilesMatch "\.(py|pyc|pyo|sqlite3|sqlite3-wal|sqlite3-shm|jsonl|npz|key|log|bak|tmp|zip)$">
  <IfModule mod_authz_core.c>
    Require all denied
  </IfModule>
  <IfModule !mod_authz_core.c>
    Order allow,deny
    Deny from all
  </IfModule>
</FilesMatch>

# ۲) پوشه‌های داخلی
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteRule ^(data|var|logs|checkpoints|deploy|scripts|tests|rayan|tokenizer|configs|\.git)(/|$) - [F,L]
</IfModule>

# ۳) فشرده‌سازی
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml \
    application/javascript application/json application/manifest+json image/svg+xml
</IfModule>

# ۴) کشِ دارایی‌های ایستا (نام‌ها نسخه‌دارند)
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType image/svg+xml "access plus 30 days"
  ExpiresByType image/png "access plus 30 days"
  ExpiresByType image/jpeg "access plus 30 days"
  ExpiresByType image/webp "access plus 30 days"
  ExpiresByType font/woff2 "access plus 1 year"
  ExpiresByType text/css "access plus 7 days"
  ExpiresByType application/javascript "access plus 7 days"
  ExpiresByType application/manifest+json "access plus 1 day"
</IfModule>

# ۵) HTTPS — اگر گواهی SSL داری، دو خطِ زیر را از حالتِ توضیح خارج کن
# <IfModule mod_rewrite.c>
#   RewriteCond %{HTTPS} !=on
#   RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
# </IfModule>

# ۶) سرآیندهای امنیتی پایه (CSP را خودِ برنامه می‌فرستد)
<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
