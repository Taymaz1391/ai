<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>گفتگوی اشتراکی · رایان</title>
  <meta name="description" content="یک گفتگوی عمومی با رایان، دستیار هوش مصنوعی فارسی.">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/static/assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="preload" href="/static/assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/pages.css">
  <script src="/static/theme-boot.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="glow glow-a"></div><div class="glow glow-b"></div></div>

  <div class="share-shell">
    <header class="share-top">
      <a class="brand" href="/">
        <img class="brand-wordmark wordmark-for-light" src="/static/assets/brand/mark-ink.png"
             alt="رایان" width="116" height="59">
        <img class="brand-wordmark wordmark-for-dark" src="/static/assets/brand/mark-white.png"
             alt="رایان" width="116" height="59">
      </a>
      <a class="btn btn-primary btn-sm" href="/chat">گفتگوی خودم</a>
    </header>

    <div class="share-body">
      <div class="share-head">
        <h1 id="share-title">گفتگوی اشتراکی</h1>
        <p>
          <span> <img class="wm-inline wordmark-for-light" src="/static/assets/brand/mark-ink.png" alt="رایان" width="1026" height="520" decoding="async"><img class="wm-inline wordmark-for-dark" src="/static/assets/brand/mark-white.png" alt="رایان" width="1026" height="520" decoding="async"> ۱ — کوچک</span>
          <span id="share-date">—</span>
          <span id="share-views">—</span>
          <span class="tag">فقط خواندن</span>
        </p>
      </div>
      <div id="share-messages" class="share-list">
        <div class="skeleton" style="height:70px;margin-bottom:14px"></div>
        <div class="skeleton" style="height:110px;margin-bottom:14px"></div>
        <div class="skeleton" style="height:70px"></div>
      </div>

      <div class="share-cta" id="share-cta" hidden>
        <h2>گفتگوی خودت را با <img class="wm-inline wordmark-for-light" src="/static/assets/brand/mark-ink.png" alt="رایان" width="1026" height="520" decoding="async"><img class="wm-inline wordmark-for-dark" src="/static/assets/brand/mark-white.png" alt="رایان" width="1026" height="520" decoding="async"> شروع کن</h2>
        <p>رایگان است، بدون ثبت‌نام هم کار می‌کند.</p>
        <a class="btn btn-primary" href="/chat">شروع گفتگو</a>
      </div>
    </div>
  </div>

  <div class="share-brand">
    <img class="wordmark-for-light" src="/static/assets/brand/mark-ink.png" alt="رایان" width="96" height="49">
    <img class="wordmark-for-dark" src="/static/assets/brand/mark-white.png" alt="رایان" width="96" height="49">
  </div>

  <script src="/static/config.js"></script>
  <script src="/static/ui.js"></script>
  <script src="/static/studio.js"></script>
  <script src="/static/ads.js"></script>
  <script src="/static/share.js"></script>
  <script src="/static/scroll.js"></script>
  <script src="/static/perf.js"></script>
</body>
</html>
