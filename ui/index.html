<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local AI Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eaf0ff;font-family:Tahoma,Arial,sans-serif}main{max-width:1050px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;background:#141d35;border:1px solid #263457;border-radius:22px;padding:18px 22px}.brand{font-size:22px;font-weight:bold}.status{font-size:12px;color:#67e8a5}.chat{flex:1;margin:18px 0;display:flex;flex-direction:column;gap:12px}.msg{max-width:78%;padding:14px 17px;border-radius:18px;line-height:1.9;white-space:pre-wrap}.user{align-self:flex-start;background:#3155d4}.bot{align-self:flex-end;background:#18243e;border:1px solid #2b3b61}.empty{text-align:center;color:#8493b8;margin:auto}.composer{display:flex;gap:10px;background:#141d35;border:1px solid #263457;padding:12px;border-radius:20px}.composer textarea{flex:1;background:#0d152a;color:white;border:0;outline:0;resize:none;font:inherit;padding:12px;height:54px}.send{border:0;border-radius:14px;background:#5b7cfa;color:white;padding:0 24px;font-weight:bold;cursor:pointer}.send:disabled{opacity:.5}.hint{text-align:center;color:#7181a6;font-size:12px;margin-top:10px}</style></head><body><main><header class="top"><div class="brand">✦ Local AI Studio</div><div class="status" id="status">● محلی و آماده</div></header><section class="chat" id="chat"><div class="empty">مدل محلی خودت را آموزش بده و گفتگو را شروع کن.</div></section><form class="composer" id="form"><textarea id="input" placeholder="پیامت را بنویس..." autofocus></textarea><button class="send" id="send">ارسال</button></form><div class="hint">بدون API خارجی · اجرای کامل روی دستگاه شما · Enter برای ارسال</div></main><script>const chat=document.querySelector('#chat'),input=document.querySelector('#input'),send=document.querySelector('#send');let sid=crypto.randomUUID();function add(text,who){const e=document.createElement('div');e.className='msg '+who;e.textContent=text;chat.querySelector('.empty')?.remove();chat.append(e);chat.scrollTop=chat.scrollHeight}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let text=input.value.trim();if(!text)return;add(text,'user');input.value='';send.disabled=true;try{let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session_id:sid})});let d=await r.json();add(d.answer||d.error||'خطا در پاسخ','bot')}catch(err){add('سرور محلی در دسترس نیست.','bot')}send.disabled=false;input.focus()};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('#form').requestSubmit()}}</script></body></html>
